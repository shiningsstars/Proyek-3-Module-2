<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>FAQ Accordion</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="container">

        <section
            class="praktikum-card"
            aria-labelledby="judul-utama"
        >

            <p class="label">Independent Challenge 2</p>

            <h1 id="judul-utama">FAQ Accordion</h1>

            <p id="status" aria-live="polite">
                Klik pertanyaan untuk melihat jawaban.
            </p>

            <div class="faq-list">

                <article class="faq-item">
                    <h2>
                        <button
                            class="faq-question"
                            type="button"
                            aria-expanded="false"
                        >
                            Apa yang sedang dipelajari?
                        </button>
                    </h2>

                    <div class="faq-answer">
                        <p>
                            Saya sedang mempelajari HTML, CSS, dan JavaScript.
                        </p>
                    </div>
                </article>

                <article class="faq-item">
                    <h2>
                        <button
                            class="faq-question"
                            type="button"
                            aria-expanded="false"
                        >
                            Apa itu JavaScript?
                        </button>
                    </h2>

                    <div class="faq-answer">
                        <p>
                            JavaScript digunakan untuk membuat halaman web
                            menjadi interaktif.
                        </p>
                    </div>
                </article>

                <article class="faq-item">
                    <h2>
                        <button
                            class="faq-question"
                            type="button"
                            aria-expanded="false"
                        >
                            Apa fungsi FAQ Accordion?
                        </button>
                    </h2>

                    <div class="faq-answer">
                        <p>
                            FAQ Accordion digunakan untuk menampilkan dan
                            menyembunyikan jawaban sesuai kebutuhan pengguna.
                        </p>
                    </div>
                </article>

            </div>

        </section>

    </main>

    <script src="js/app.js" defer></script>

</body>

</html>
